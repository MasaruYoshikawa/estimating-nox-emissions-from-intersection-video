[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-emission"
version = "0.1.0"
description = "Evaluating a relative video-derived traffic NOx emission index against hourly ambient observations at two Tokyo intersections."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Masaru Yoshikawa" },
]
keywords = [
    "vehicle emissions",
    "intersection traffic",
    "RT-DETR",
    "ByteTrack",
    "MOVEStar",
    "Spearman correlation",
    "Tokyo",
    "NOx",
]

dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "matplotlib==3.9.4",
    "pyarrow==17.0.0",
    "requests==2.32.3",
    "pyyaml==6.0.2",
    "opencv-python==4.10.0.84",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.9.10",
    "black==25.1.0",
    "mypy==1.15.0",
]
vision = [
    "pillow==11.0.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics==8.3.220",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    "src/vehicle_emission/baselines/RT-DETR",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = 'src/vehicle_emission/baselines/RT-DETR'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
