# Custom ByteTrack configuration for 10 FPS intersection video
tracker_type: bytetrack  # tracker type, ['botsort', 'bytetrack']

#Base Line
track_high_thresh: 0.25  # threshold for the first association (lowered further for small high-angle vehicles)
track_low_thresh: 0.1    # threshold for the second association
new_track_thresh: 0.3    # threshold for init new track (must be > high_thresh)

track_buffer: 50         # buffer to calculate the time when to remove tracks (longer for 10 FPS)
match_thresh: 0.80       # threshold for matching tracks

fuse_score: True         # Whether to fuse confidence scores with the iou distances before matching
gmc_method: sparseOptFlow # GMC (Global Motion Compensation) method, only used by BoTSORT

#Tuning
# track_high_thresh: 0.20  # threshold for the first association (lowered further for small high-angle vehicles)
# track_low_thresh: 0.1    # threshold for the second association
# new_track_thresh: 0.25    # threshold for init new track (must be > high_thresh)

# track_buffer: 90         # buffer to calculate the time when to remove tracks (longer for 10 FPS)
# match_thresh: 0.70       # threshold for matching tracks

# fuse_score: True         # Whether to fuse confidence scores with the iou distances before matching
# gmc_method: sparseOptFlow # GMC (Global Motion Compensation) method, only used by BoTSORT
