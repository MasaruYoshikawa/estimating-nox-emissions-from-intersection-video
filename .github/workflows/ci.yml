name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install environment
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint checks
        run: |
          ruff check src tests
          black --check src tests
      - name: Run test suite
        run: pytest
      - name: Verify publication inventory
        run: python -m scripts.publication_manifest --check
      - name: Replay published-panel smoke
        run: >-
          make PYTHON=python replay-statistics
          REPLAY_OUTPUT=build/ci_panel_replay
          REPLAY_CORE_RESAMPLES=50 REPLAY_EXTENSION_RESAMPLES=50
